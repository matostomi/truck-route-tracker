<title>GALAFI → KOMBOLCHA → DEBRE BIRHAN | Truck Route Tracker</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  font-family:Arial,sans-serif;
  color:#303038;
}

.wrap{
  width:1100px;
  max-width:96%;
  margin:auto;
}

.header{
  padding:18px 4px 8px;
}

.header h1{
  margin:0;
  font-size:32px;
  line-height:1.15;
  font-weight:500;
  letter-spacing:.1px;
}

.subtitle{
  margin:9px 0 18px;
  color:#777b86;
  font-size:18px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:12px;
}

.metric{
  height:42px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:500;
  letter-spacing:.1px;
  border:1px solid #e4e7e8;
}

.metric:nth-child(1){
  background:#effdfa;
  border-color:#c7f2ea;
  color:#187b6b;
}

.metric:nth-child(2){
  background:#f0fbf4;
  border-color:#d2f0dc;
  color:#267a58;
}

.metric:nth-child(3){
  background:#f3f6fd;
  border-color:#d8e0f3;
  color:#425f9a;
}

.metric:nth-child(4){
  background:#fff8ec;
  border-color:#f2e2c6;
  color:#9a6a27;
}


/* =========================================
   MAIN TRACKER AREA
   ========================================= */

.tracker-area{
  display:grid;
  grid-template-columns:270px 1fr;
  gap:20px;
  align-items:start;
}


/* =========================================
   CUSTOMER / CONTAINER CARD
   ========================================= */

.shipment-card{
  margin-top:25px;
  padding:20px;
  border:1px solid #e2e5e7;
  border-radius:14px;
  background:#fafcfc;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.shipment-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:18px;
  color:#303038;
}

.form-label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
  color:#555962;
}

.shipment-card select,
.shipment-card input{
  width:100%;
  height:42px;
  padding:8px 12px;
  font-size:15px;
  border:1px solid #c7cbcf;
  border-radius:7px;
  background:#fff;
  color:#303038;
  outline:none;
}

.shipment-card select:focus,
.shipment-card input:focus{
  border-color:#1d9e75;
  box-shadow:0 0 0 2px rgba(29,158,117,.12);
}

.form-group{
  margin-bottom:16px;
}

.save-button{
  width:100%;
  height:43px;
  border:0;
  border-radius:7px;
  background:#1d9e75;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.save-button:hover{
  background:#167d5e;
}

.save-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#shipmentStatus{
  margin-top:12px;
  min-height:20px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}


/* =========================================
   ROUTE / LOCATION CONTROL
   ========================================= */

.route-area{
  min-width:0;
}

.controls{
  text-align:center;
  padding:10px 8px 4px;
}

.location-select{
  font-size:15px;
  padding:8px 12px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
}

#status{
  margin-top:8px;
  font-size:15px;
  font-weight:700;
}

svg{
  width:100%;
  height:auto;
  display:block;
}

.dot{
  transition:r .2s;
}

.active .dot{
  animation:blink .8s infinite;
}

.active .halo{
  animation:pulse 1s infinite;
}

@keyframes blink{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.15;
  }
}

@keyframes pulse{
  0%,100%{
    opacity:.15;
  }

  50%{
    opacity:.65;
  }
}

.label-active{
  font-weight:700!important;
}


/* =========================================
   MOBILE
   ========================================= */

@media(max-width:850px){

  .tracker-area{
    grid-template-columns:1fr;
  }

  .shipment-card{
    margin-top:5px;
  }

}

@media(max-width:700px){

    font-size:25px;
  }

  }

  .metrics{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .metric{
    font-size:14px;
    height:38px;
  }

}

<!-- =========================================

<script>

const SUPABASE_URL =
  "https://nqngncyvtvsptlyqizpg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tUa87rjEkzu1OTM3Fd_X4w_ayDg6RW9";


/* =========================================
   DISTANCES
   ========================================= */

const distances = {

  "Galafi":
    "567 km remaining",

  "Semera / Logiya":
    "453 km remaining",

  "Mile":
    "366 km remaining",

  "Bati":
    "218 km remaining",

  "Kombolcha":
    "200 km remaining",

  "Kemise":
    "150 km remaining",

  "Shewa Robit":
    "60 km remaining",

  "Debre Birhan":
    "0 km · arrived"

};


/* =========================================
   ELEMENTS
   ========================================= */

const locationSelect =
  document.getElementById("location");

const status =
  document.getElementById("status");

const customerSelect =
  document.getElementById("customer");

const containerInput =
  document.getElementById("containerNo");

const saveShipmentButton =
  document.getElementById("saveShipment");

const shipmentStatus =
  document.getElementById("shipmentStatus");


/* =========================================
   SHOW TRUCK LOCATION
   ========================================= */

function showLocation(current){

  if(!distances[current]){
    return;
  }

  locationSelect.value =
    current;


  document
    .querySelectorAll("g[data-name]")
    .forEach(g => {

      const active =
        g.dataset.name === current;


      g.classList.toggle(
        "active",
        active
      );


      const name =
        g.querySelector(".name");


      if(name){

        name.classList.toggle(
          "label-active",
          active
        );

      }

    });


  status.textContent =
    "🚚 Arrived at " +
    current +
    " · " +
    distances[current];

}


/* =========================================
   LOAD ALL DATA FROM SUPABASE
   ========================================= */

async function loadData(){

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/truck_status?id=eq.1&select=location,customer,container_no",

        {

          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if(!response.ok){

      console.error(
        "Supabase load error:",
        await response.text()
      );

      return;

    }


    const data =
      await response.json();


    if(data.length > 0){

      const truck =
        data[0];


      /* Location */

      if(truck.location){

        showLocation(
          truck.location
        );

      }


      /* Customer */

      if(truck.customer){

        customerSelect.value =
          truck.customer;

      }


      /* Container */

      if(
        truck.container_no !== null &&
        truck.container_no !== undefined
      ){

        containerInput.value =
          truck.container_no;

      }

    }

  }

  catch(error){

    console.error(
      "Could not load Supabase data:",
      error
    );

  }

}


/* =========================================
   SAVE CUSTOMER + CONTAINER
   ========================================= */

async function saveShipment(){

  const customer =
    customerSelect.value;

  const containerNo =
    containerInput.value.trim();


  if(!containerNo){

    shipmentStatus.textContent =
      "⚠️ Please enter the container number.";

    shipmentStatus.style.color =
      "#b42318";

    containerInput.focus();

    return;

  }


  saveShipmentButton.disabled =
    true;

  saveShipmentButton.textContent =
    "SAVING...";


  shipmentStatus.textContent =
    "Saving...";

  shipmentStatus.style.color =
    "#555";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/truck_status?id=eq.1",

        {

          method:"PATCH",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              customer:
                customer,

              container_no:
                containerNo,

              updated_at:
                new Date().toISOString()

            })

        }

      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        "Save shipment error:",
        errorText
      );


      shipmentStatus.textContent =
        "❌ Save failed. Check Supabase policy.";

      shipmentStatus.style.color =
        "#b42318";

      return;

    }


    shipmentStatus.textContent =
      "✓ Shipment saved successfully";

    shipmentStatus.style.color =
      "#187b6b";


    setTimeout(() => {

      shipmentStatus.textContent =
        "";

    },3000);

  }

  catch(error){

    console.error(error);

    shipmentStatus.textContent =
      "❌ Connection error.";

    shipmentStatus.style.color =
      "#b42318";

  }

  finally{

    saveShipmentButton.disabled =
      false;

    saveShipmentButton.textContent =
      "SAVE SHIPMENT";

  }

}


/* =========================================
   SAVE TRUCK LOCATION
   ========================================= */

async function saveLocation(location){

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/truck_status?id=eq.1",

        {

          method:"PATCH",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              location:
                location,

              updated_at:
                new Date().toISOString()

            })

        }

      );


    if(!response.ok){

      console.error(
        "Location save error:",
        await response.text()
      );

      return;

    }


    showLocation(
      location
    );

  }

  catch(error){

    console.error(
      "Could not save location:",
      error
    );

  }

}


/* =========================================
   LOCATION DROPDOWN
   ========================================= */

locationSelect.addEventListener(
  "change",
  function(){

    saveLocation(
      locationSelect.value
    );

  }
);


/* =========================================
   SAVE SHIPMENT BUTTON
   ========================================= */

saveShipmentButton.addEventListener(
  "click",
  saveShipment
);


/* =========================================
   LOAD DATA WHEN PAGE OPENS
   ========================================= */

loadData();


/* =========================================
   CHECK FOR UPDATES EVERY 3 SECONDS
   ========================================= */

setInterval(
  loadData,
  3000
);

</script>
