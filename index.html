<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truck Route Tracker | Synergy Plus Logistics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 20px;
}

/* HEADER */
.header {
    background: #111827;
    color: white;
    padding: 24px;
    border-radius: 18px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.header p {
    margin: 0;
    color: #cbd5e1;
}

/* METRICS */
.metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.metric {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.metric .value {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
}

.metric .label {
    color: #64748b;
    font-size: 13px;
}

/* MAIN GRID */
.main-grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
}

/* CARD */
.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.card h2 {
    margin-top: 0;
    font-size: 19px;
}

/* FORM */
label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin-top: 15px;
    margin-bottom: 6px;
}

select,
input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 14px;
    background: white;
}

textarea {
    min-height: 125px;
    resize: vertical;
    font-family: Arial, Helvetica, sans-serif;
}

/* SAVE BUTTON */
.save-btn {
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 9px;
    padding: 13px;
    width: 100%;
    margin-top: 16px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.save-btn:hover {
    background: #1d4ed8;
}

/* STATUS */
.current-status {
    margin-top: 18px;
    background: #f8fafc;
    border-radius: 12px;
    padding: 15px;
}

.status-title {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 5px;
    font-weight: bold;
}

.status-location {
    font-size: 20px;
    font-weight: bold;
}

.distance {
    color: #2563eb;
    margin-top: 5px;
    font-weight: bold;
}

/* REMARK */
.remark-box {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
}

.remark-title {
    font-size: 12px;
    font-weight: bold;
    color: #9a3412;
    margin-bottom: 7px;
}

.remark-text {
    font-size: 14px;
    line-height: 1.5;
    color: #431407;
    white-space: pre-wrap;
}

/* MESSAGE */
.message {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    display: none;
    font-size: 13px;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

/* MAP */
.map-card {
    min-height: 600px;
}

.map-wrapper {
    overflow-x: auto;
}

svg {
    width: 100%;
    min-width: 700px;
    height: 500px;
}

/* ROUTE */
.route-line {
    fill: none;
    stroke: #cbd5e1;
    stroke-width: 8;
    stroke-linecap: round;
}

.route-line-inner {
    fill: none;
    stroke: #2563eb;
    stroke-width: 4;
    stroke-linecap: round;
}

.station circle {
    fill: white;
    stroke: #2563eb;
    stroke-width: 4;
}

.station .name {
    font-size: 15px;
    font-weight: bold;
    fill: #334155;
}

.station.active circle {
    fill: #2563eb;
    stroke: #93c5fd;
}

.station.active .name {
    fill: #1d4ed8;
    font-size: 17px;
}

.pulse {
    display: none;
}

.station.active .pulse {
    display: block;
    fill: none;
    stroke: #2563eb;
    stroke-width: 4;
    animation: pulse 1.4s infinite;
}

@keyframes pulse {
    0% {
        r: 12;
        opacity: 1;
    }

    100% {
        r: 30;
        opacity: 0;
    }
}

/* MOBILE */
@media(max-width: 900px) {

    .metrics {
        grid-template-columns: repeat(2, 1fr);
    }

    .main-grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 600px) {

    .container {
        padding: 10px;
    }

    .header h1 {
        font-size: 22px;
    }

    .metrics {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <h1>
            GALAFI → KOMBOLCHA → DEBRE BIRHAN
        </h1>

        <p>
            Synergy Plus Logistics · Ethio-Djibouti Truck Status
        </p>

    </div>


    <!-- METRICS -->
    <div class="metrics">

        <div class="metric">
            <div class="value">567 km</div>
            <div class="label">Total Route</div>
        </div>

        <div class="metric">
            <div class="value">2 → 3 Day </div>
            <div class="label">Estimate arrive </div>
        </div>

        <div class="metric">
            <div class="value">8</div>
            <div class="label">Key Stations</div>
        </div>

    </div>


    <!-- MAIN -->
    <div class="main-grid">


        <!-- LEFT INFORMATION CARD -->
        <div class="card">

            <h2>
                Shipment Information
            </h2>


            <!-- CUSTOMER -->
            <label for="customer">
                Customer
            </label>

            <select id="customer">

                <option value="EK">
                    EK
                </option>

                <option value="DESTA">
                    DESTA
                </option>

            </select>


            <!-- CONTAINER -->
            <label for="container">
                Container No.
            </label>

            <input
                id="container"
                type="text"
                placeholder="Enter container number"
            >


            <!-- LOCATION -->
            <label for="location">
                Current Truck Location
            </label>

            <select id="location">

                <option value="Galafi">
                    Galafi
                </option>

                <option value="Semera / Logiya">
                    Semera / Logiya
                </option>

                <option value="Mile">
                    Mile
                </option>

                <option value="Bati">
                    Bati
                </option>

                <option value="Kombolcha">
                    Kombolcha
                </option>

                <option value="Kemise">
                    Kemise
                </option>

                <option value="Shewa Robit">
                    Shewa Robit
                </option>

                <option value="Debre Birhan">
                    Debre Birhan
                </option>

            </select>


            <!-- REMARK -->
            <label for="remark">
                Remark / Delay Reason
            </label>

            <textarea
                id="remark"
                placeholder="Write what the driver reported..."
            ></textarea>


            <!-- SAVE -->
            <button
                class="save-btn"
                onclick="saveUpdate()"
            >
                SAVE UPDATE
            </button>


            <!-- SAVE MESSAGE -->
            <div
                class="message"
                id="saveMessage"
            ></div>


            <!-- CURRENT LOCATION -->
            <div class="current-status">

                <div class="status-title">
                    CURRENT TRUCK LOCATION
                </div>

                <div
                    class="status-location"
                    id="status"
                >
                    🚚 Arrived at Galafi
                </div>

                <div
                    class="distance"
                    id="distance"
                >
                    567 km remaining
                </div>

            </div>


            <!-- REMARK DISPLAY -->
            <div class="remark-box">

                <div class="remark-title">
                    REMARK
                </div>

                <div
                    class="remark-text"
                    id="remarkDisplay"
                >
                    No remark available.
                </div>

            </div>

        </div>


        <!-- MAP -->
        <div class="card map-card">

            <h2>
                Truck Route
            </h2>

            <div class="map-wrapper">

                <svg
                    viewBox="0 0 900 500"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- ROUTE LINE -->
                    <path
                        class="route-line"
                        d="M90 420
                           C150 390 170 350 230 330
                           C290 310 300 270 360 250
                           C420 230 450 200 500 180
                           C550 160 590 130 640 120
                           C700 105 740 80 810 60"
                    />

                    <path
                        class="route-line-inner"
                        d="M90 420
                           C150 390 170 350 230 330
                           C290 310 300 270 360 250
                           C420 230 450 200 500 180
                           C550 160 590 130 640 120
                           C700 105 740 80 810 60"
                    />


                    <!-- GALAFI -->
                    <g
                        class="station"
                        data-name="Galafi"
                        transform="translate(90,420)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-25"
                            y="35"
                        >
                            Galafi
                        </text>

                    </g>


                    <!-- SEMERA / LOGIYA -->
                    <g
                        class="station"
                        data-name="Semera / Logiya"
                        transform="translate(230,330)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-40"
                            y="-20"
                        >
                            Semera / Logiya
                        </text>

                    </g>


                    <!-- MILE -->
                    <g
                        class="station"
                        data-name="Mile"
                        transform="translate(360,250)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-15"
                            y="-20"
                        >
                            Mile
                        </text>

                    </g>


                    <!-- BATI -->
                    <g
                        class="station"
                        data-name="Bati"
                        transform="translate(500,180)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-15"
                            y="-20"
                        >
                            Bati
                        </text>

                    </g>


                    <!-- KEMISE -->
                    <g
                        class="station"
                        data-name="Kemise"
                        transform="translate(550,160)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-20"
                            y="35"
                        >
                            Kemise
                        </text>

                    </g>


                    <!-- KOMBOLCHA -->
                    <g
                        class="station"
                        data-name="Kombolcha"
                        transform="translate(640,120)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-35"
                            y="-20"
                        >
                            Kombolcha
                        </text>

                    </g>


                    <!-- SHEWA ROBIT -->
                    <g
                        class="station"
                        data-name="Shewa Robit"
                        transform="translate(700,105)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-35"
                            y="-20"
                        >
                            Shewa Robit
                        </text>

                    </g>


                    <!-- DEBRE BIRHAN -->
                    <g
                        class="station"
                        data-name="Debre Birhan"
                        transform="translate(810,60)"
                    >

                        <circle
                            class="pulse"
                            r="12"
                        />

                        <circle r="9" />

                        <text
                            class="name"
                            x="-45"
                            y="-20"
                        >
                            Debre Birhan
                        </text>

                    </g>

                </svg>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
========================================================= */

const SUPABASE_URL =
    "https://nqngncyvtvsptlyqizpg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tUa87rjEkzu1OTM3Fd_X4w_ayDg6RW9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DISTANCES
========================================================= */

const distances = {

    "Galafi":
        "567 km remaining",

    "Semera / Logiya":
        "453 km remaining",

    "Mile":
        "366 km remaining",

    "Bati":
        "218 km remaining",

    "Kombolcha":
        "200 km remaining",

    "Kemise":
        "150 km remaining",

    "Shewa Robit":
        "60 km remaining",

    "Debre Birhan":
        "0 km · arrived"

};


/* =========================================================
   ELEMENTS
========================================================= */

const locationSelect =
    document.getElementById("location");

const customerSelect =
    document.getElementById("customer");

const containerInput =
    document.getElementById("container");

const remarkInput =
    document.getElementById("remark");

const statusElement =
    document.getElementById("status");

const distanceElement =
    document.getElementById("distance");

const remarkDisplay =
    document.getElementById("remarkDisplay");

const saveMessage =
    document.getElementById("saveMessage");


/* =========================================================
   UPDATE MAP
========================================================= */

function updateMap(location) {

    document
        .querySelectorAll(".station")
        .forEach(station => {

            const active =
                station.dataset.name === location;

            station.classList.toggle(
                "active",
                active
            );

        });


    statusElement.textContent =
        "🚚 Arrived at " + location;


    distanceElement.textContent =
        distances[location] || "";

}


/* =========================================================
   LOAD DATA FROM SUPABASE
========================================================= */

async function loadData() {

    const {
        data,
        error
    } = await supabaseClient

        .from("truck_status")

        .select(
            "location, customer, container_no, remark, updated_at"
        )

        .eq("id", 1)

        .single();


    if (error) {

        console.error(
            "Load error:",
            error
        );

        return;
    }


    if (!data) {
        return;
    }


    /* LOCATION */

    if (data.location) {

        locationSelect.value =
            data.location;

        updateMap(
            data.location
        );

    }


    /* CUSTOMER */

    if (data.customer) {

        customerSelect.value =
            data.customer;

    }


    /* CONTAINER */

    if (data.container_no !== null) {

        containerInput.value =
            data.container_no || "";

    }


    /* REMARK */

    if (data.remark) {

        remarkInput.value =
            data.remark;

        remarkDisplay.textContent =
            data.remark;

    } else {

        remarkInput.value = "";

        remarkDisplay.textContent =
            "No remark available.";

    }

}


/* =========================================================
   SAVE UPDATE
========================================================= */

async function saveUpdate() {

    const location =
        locationSelect.value;

    const customer =
        customerSelect.value;

    const container =
        containerInput.value.trim();

    const remark =
        remarkInput.value.trim();


    saveMessage.className =
        "message";

    saveMessage.textContent =
        "";


    const {
        error
    } = await supabaseClient

        .from("truck_status")

        .update({

            location:
                location,

            customer:
                customer,

            container_no:
                container || null,

            remark:
                remark || null,

            updated_at:
                new Date().toISOString()

        })

        .eq("id", 1);


    if (error) {

        console.error(
            "Save error:",
            error
        );

        saveMessage.className =
            "message error";

        saveMessage.textContent =
            "Update failed: " +
            error.message;

        return;
    }


    /* UPDATE SCREEN */

    updateMap(location);


    if (remark) {

        remarkDisplay.textContent =
            remark;

    } else {

        remarkDisplay.textContent =
            "No remark available.";

    }


    saveMessage.className =
        "message success";

    saveMessage.textContent =
        "✓ Update saved successfully.";


    setTimeout(() => {

        saveMessage.className =
            "message";

        saveMessage.textContent =
            "";

    }, 3000);

}


/* =========================================================
   LOCATION CHANGE
========================================================= */

locationSelect.addEventListener(
    "change",
    function() {

        updateMap(
            this.value
        );

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadData();


/* =========================================================
   AUTO REFRESH EVERY 5 SECONDS
========================================================= */

setInterval(
    loadData,
    5000
);

</script>

</body>
</html>
