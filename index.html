<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Synergy Plus Logistics - Truck Status
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    color: #303030;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    max-width: 1050px;
    margin: auto;
    padding: 0 28px 40px;
}


/* =========================
   HEADER
========================= */

.header {
    padding-top: 5px;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 500;
    color: #17324d;
    letter-spacing: -1px;
}

.header p {
    margin: 10px 0 0;
    font-size: 20px;
    color: #71808f;
}


/* =========================
   TOP INFO
========================= */

.top-info {
    display: flex;
    gap: 16px;
    margin: 6px 0 25px;
}

.info-box {
    border-radius: 30px;
    padding: 10px 28px;
    min-width: 220px;
    text-align: center;
    font-size: 18px;
    color: #267f68;
    border: 1px solid #c7eee4;
    background: #f5fffc;
}

.info-box.blue {
    color: #405d9b;
    border-color: #d3def8;
    background: #f7f9ff;
}

.info-box strong {
    font-weight: 500;
}


/* =========================
   UPDATE AREA
========================= */

.update-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    align-items: start;
    margin-bottom: 15px;
}

.update-left {
    min-height: 115px;
}

.update-right {
    padding-top: 3px;
}

.form-row {
    margin-bottom: 12px;
}

.form-row label {
    display: inline-block;
    font-weight: bold;
    font-size: 16px;
    margin-right: 8px;
}

select,
input,
textarea {
    border: 1px solid #c9cfd5;
    border-radius: 7px;
    background: white;
    color: #333;
    font-family: Arial, Helvetica, sans-serif;
}

select {
    padding: 9px 38px 9px 12px;
    font-size: 15px;
}

input {
    padding: 9px 12px;
    font-size: 15px;
    width: 190px;
}

textarea {
    width: 100%;
    min-height: 75px;
    padding: 10px 12px;
    font-size: 14px;
    resize: vertical;
}

textarea::placeholder,
input::placeholder {
    color: #8b9299;
}


/* =========================
   CURRENT STATUS
========================= */

.current-status {
    margin-top: 14px;
}

.current-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
}

.status-line {
    font-size: 18px;
    font-weight: bold;
    color: #222;
}

.distance-top {
    font-size: 18px;
    font-weight: bold;
    margin-top: 8px;
}


/* =========================
   REMARK
========================= */

.remark-label {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 7px;
}

.save-button {
    margin-top: 8px;
    padding: 9px 24px;
    border: none;
    border-radius: 7px;
    background: #15966d;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: #107b5a;
}

.message {
    display: none;
    margin-top: 8px;
    font-size: 14px;
}

.message.success {
    display: block;
    color: #15803d;
}

.message.error {
    display: block;
    color: #dc2626;
}


/* =========================
   ROUTE
========================= */

.route-area {
    position: relative;
    margin-top: 5px;
    padding-bottom: 20px;
}

.route-svg {
    width: 100%;
    height: auto;
    display: block;
}


/* Route line */

.route-line {
    stroke: #22a879;
    stroke-width: 5;
    fill: none;
    stroke-linecap: round;
}


/* Station */

.station-circle {
    fill: #61cda9;
    stroke: #188b68;
    stroke-width: 2;
}

.station-label {
    font-size: 18px;
    font-weight: bold;
    fill: #303030;
}

.station-amharic {
    font-size: 15px;
    fill: #666;
}

.distance-label {
    font-size: 17px;
    font-weight: bold;
    fill: #303030;
}

.destination-circle {
    fill: #f29a70;
    stroke: #c65e39;
    stroke-width: 2;
}


/* =========================
   ACTIVE LOCATION
========================= */

.active-circle {
    fill: #f6a078;
    stroke: #ef6f3f;
    stroke-width: 3;
}

.active-pulse {
    fill: none;
    stroke: #f6a078;
    stroke-width: 5;
    opacity: 0.6;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {

    0% {
        r: 13;
        opacity: 0.8;
    }

    100% {
        r: 27;
        opacity: 0;
    }

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .page {
        padding: 0 15px 30px;
    }

    .header h1 {
        font-size: 27px;
    }

    .header p {
        font-size: 16px;
    }

    .top-info {
        flex-wrap: wrap;
    }

    .info-box {
        min-width: 170px;
        flex: 1;
        font-size: 15px;
    }

    .update-area {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .route-svg {
        min-width: 700px;
    }

    .route-area {
        overflow-x: auto;
    }

}

</style>

</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://nqngncyvtvsptlyqizpg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tUa87rjEkzu1OTM3Fd_X4w_ayDg6RW9";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DISTANCES
========================================================= */

const distances = {

    "Galafi":
        "567 km remaining",

    "Semera / Logiya":
        "453 km remaining",

    "Mile":
        "366 km remaining",

    "Bati":
        "218 km remaining",

    "Kombolcha":
        "200 km remaining",

    "Kemise":
        "150 km remaining",

    "Shewa Robit":
        "60 km remaining",

    "Debre Birhan":
        "0 km · arrived"

};


/* =========================================================
   ELEMENTS
========================================================= */

const locationSelect =
    document.getElementById("location");

const customerSelect =
    document.getElementById("customer");

const containerInput =
    document.getElementById("container");

const remarkInput =
    document.getElementById("remark");

const statusElement =
    document.getElementById("status");

const messageElement =
    document.getElementById("message");


/* =========================================================
   STATION IDS
========================================================= */

const stationIDs = {

    "Galafi": {
        circle: "circle-Galafi",
        pulse: "pulse-Galafi"
    },

    "Semera / Logiya": {
        circle: "circle-Semera",
        pulse: "pulse-Semera"
    },

    "Mile": {
        circle: "circle-Mile",
        pulse: "pulse-Mile"
    },

    "Bati": {
        circle: "circle-Bati",
        pulse: "pulse-Bati"
    },

    "Kombolcha": {
        circle: "circle-Kombolcha",
        pulse: "pulse-Kombolcha"
    },

    "Kemise": {
        circle: "circle-Kemise",
        pulse: "pulse-Kemise"
    },

    "Shewa Robit": {
        circle: "circle-Shewa",
        pulse: "pulse-Shewa"
    },

    "Debre Birhan": {
        circle: "circle-Debre",
        pulse: "pulse-Debre"
    }

};


/* =========================================================
   UPDATE CURRENT LOCATION ON MAP
========================================================= */

function updateMap(location) {

    /* Reset all stations */

    Object.values(stationIDs).forEach(station => {

        const circle =
            document.getElementById(
                station.circle
            );

        const pulse =
            document.getElementById(
                station.pulse
            );


        circle.classList.remove(
            "active-circle"
        );

        circle.classList.add(
            "station-circle"
        );


        pulse.style.display =
            "none";

    });


    /* Activate selected station */

    const selected =
        stationIDs[location];


    if (!selected) {
        return;
    }


    const activeCircle =
        document.getElementById(
            selected.circle
        );

    const activePulse =
        document.getElementById(
            selected.pulse
        );


    activeCircle.classList.remove(
        "station-circle"
    );

    activeCircle.classList.add(
        "active-circle"
    );


    activePulse.style.display =
        "block";


    /* Current status */

    statusElement.textContent =
        "🚚 Arrived at " +
        location +
        " · " +
        distances[location];

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    const {
        data,
        error
    } = await supabaseClient

        .from("truck_status")

        .select(
            "location, customer, container_no, remark, updated_at"
        )

        .eq("id", 1)

        .single();


    if (error) {

        console.error(
            "Supabase load error:",
            error
        );

        return;
    }


    if (!data) {
        return;
    }


    /* Location */

    if (data.location) {

        locationSelect.value =
            data.location;

        updateMap(
            data.location
        );

    }


    /* Customer */

    if (data.customer) {

        customerSelect.value =
            data.customer;

    }


    /* Container */

    if (data.container_no !== null) {

        containerInput.value =
            data.container_no || "";

    }


    /* Remark */

    if (data.remark !== null) {

        remarkInput.value =
            data.remark || "";

    }

}


/* =========================================================
   SAVE UPDATE
========================================================= */

async function saveUpdate() {

    const location =
        locationSelect.value;

    const customer =
        customerSelect.value;

    const container =
        containerInput.value.trim();

    const remark =
        remarkInput.value.trim();


    messageElement.className =
        "message";

    messageElement.textContent =
        "";


    const {
        error
    } = await supabaseClient

        .from("truck_status")

        .update({

            location:
                location,

            customer:
                customer,

            container_no:
                container || null,

            remark:
                remark || null,

            updated_at:
                new Date().toISOString()

        })

        .eq("id", 1);


    if (error) {

        console.error(
            "Supabase save error:",
            error
        );

        messageElement.className =
            "message error";

        messageElement.textContent =
            "Update failed: " +
            error.message;

        return;
    }


    /* Update screen immediately */

    updateMap(location);


    messageElement.className =
        "message success";

    messageElement.textContent =
        "✓ Update saved successfully.";


    setTimeout(() => {

        messageElement.className =
            "message";

        messageElement.textContent =
            "";

    }, 3000);

}


/* =========================================================
   LOCATION CHANGE
========================================================= */

locationSelect.addEventListener(
    "change",
    function() {

        updateMap(
            this.value
        );

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadData();


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    loadData,
    5000
);

</script>
