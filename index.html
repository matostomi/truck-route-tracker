<script>
const SUPABASE_URL = "https://nqngncyvtvsptlyqizpg.supabase.co";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const distances = {
  "Galafi":"567 km remaining",
  "Semera / Logiya":"453 km remaining",
  "Mile":"366 km remaining",
  "Bati":"218 km remaining",
  "Kombolcha":"200 km remaining",
  "Kemise":"150 km remaining",
  "Shewa Robit":"60 km remaining",
  "Debre Birhan":"0 km · arrived"
};

const select = document.getElementById("location");
const status = document.getElementById("status");

function showLocation(current) {
  select.value = current;

  document.querySelectorAll("g[data-name]").forEach(g => {
    const active = g.dataset.name === current;
    g.classList.toggle("active", active);
    g.querySelector(".name").classList.toggle("label-active", active);
  });

  status.textContent =
    "🚚 Arrived at " + current + " · " + distances[current];
}

async function loadLocation() {
  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/truck_status?id=eq.1&select=location",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const data = await response.json();

    if (data.length > 0) {
      showLocation(data[0].location);
    }
  } catch (error) {
    console.error("Could not load truck location:", error);
  }
}

async function saveLocation(location) {
  try {
    await fetch(
      SUPABASE_URL + "/rest/v1/truck_status?id=eq.1",
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          location: location,
          updated_at: new Date().toISOString()
        })
      }
    );

    showLocation(location);
  } catch (error) {
    console.error("Could not save truck location:", error);
  }
}

select.addEventListener("change", () => {
  saveLocation(select.value);
});

// Load current shared location
loadLocation();

// Check for changes every 3 seconds
setInterval(loadLocation, 3000);
</script>
