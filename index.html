     SUPABASE SHARED TRUCK LOCATION

<script>

const SUPABASE_URL =
  "https://nqngncyvtvsptlyqizpg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tUa87rjEkzu1OTM3Fd_X4w_ayDg6RW9";


const distances = {

  "Galafi":
    "567 km remaining",

  "Semera / Logiya":
    "453 km remaining",

  "Mile":
    "366 km remaining",

  "Bati":
    "218 km remaining",

  "Kombolcha":
    "200 km remaining",

  "Kemise":
    "150 km remaining",

  "Shewa Robit":
    "60 km remaining",

  "Debre Birhan":
    "0 km · arrived"

};


const select =
  document.getElementById("location");

const status =
  document.getElementById("status");


/* =========================================
   SHOW CURRENT TRUCK LOCATION
   ========================================= */

function showLocation(current) {

  if (!distances[current]) {
    return;
  }

  select.value = current;


  document
    .querySelectorAll("g[data-name]")
    .forEach(g => {

      const active =
        g.dataset.name === current;


      g.classList.toggle(
        "active",
        active
      );


      const name =
        g.querySelector(".name");


      if (name) {

        name.classList.toggle(
          "label-active",
          active
        );

      }

    });


  status.textContent =
    "🚚 Arrived at " +
    current +
    " · " +
    distances[current];

}


/* =========================================
   LOAD LOCATION FROM SUPABASE
   ========================================= */

async function loadLocation() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/truck_status?id=eq.1&select=location",

        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {

      console.error(
        "Supabase load error:",
        await response.text()
      );

      return;

    }


    const data =
      await response.json();


    if (data.length > 0) {

      showLocation(
        data[0].location
      );

    }

  }

  catch (error) {

    console.error(
      "Could not load truck location:",
      error
    );

  }

}


/* =========================================
   SAVE LOCATION TO SUPABASE
   ========================================= */

async function saveLocation(location) {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/truck_status?id=eq.1",

        {

          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              location:
                location,

              updated_at:
                new Date().toISOString()

            })

        }

      );


    if (!response.ok) {

      console.error(
        "Supabase update error:",
        await response.text()
      );

      status.textContent =
        "⚠️ Could not save location";

      return;

    }


    showLocation(location);

  }

  catch (error) {

    console.error(
      "Could not save truck location:",
      error
    );

    status.textContent =
      "⚠️ Connection error";

  }

}


/* =========================================
   WHEN YOU CHANGE LOCATION
   ========================================= */

select.addEventListener(
  "change",
  function() {

    saveLocation(
      select.value
    );

  }
);


/* =========================================
   LOAD SHARED LOCATION
   WHEN PAGE OPENS
   ========================================= */

loadLocation();


/* =========================================
   CHECK FOR NEW LOCATION EVERY 3 SECONDS
   ========================================= */

setInterval(
  loadLocation,
  3000
);

</script>
